<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic Survival Simulator</title>
  <meta
          name="description"
          content="Would YOU survive the Titanic? Pick your passenger parameters and see your survival chances using real data from the Kaggle Titanic dataset."
  />
  <link rel="icon" href="src/public/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="start-screen" id="start-screen">
  <div class="start-screen__content">
    <h1 class="start-screen__title">
      Would <span class="start-screen__highlight">YOU</span> Survive the Titanic?
    </h1>
    <p class="start-screen__subtitle">
      An interactive experience with real historical data
    </p>
    <button class="start-screen__button" id="start-button">
      START EXPERIENCE
    </button>
  </div>
</div>

<section class="hero">
  <div class="hero__sky"></div>

  <div class="hero__sea">
    <div class="hero__bg-iceberg-wrapper">
      <img src="src/public/images/hero/hero_iceberg_bg.png" alt="Background iceberg" class="hero__bg-iceberg"/>
    </div>

    <div class="hero__bg-ship-trail-wrapper">
      <img src="src/public/images/hero/hero_ship_bg_trail.png" alt="" class="hero__bg-ship-trail"/>
    </div>

    <div class="hero__bg-ship-wrapper">
      <img src="src/public/images/hero/hero_ship_bg.png" alt="Background ship" class="hero__bg-ship"/>
    </div>
  </div>

  <div class="hero__scene">
    <img src="src/public/images/hero/hero_ship_large.png" alt="Titanic" class="hero__ship-large floating-medium"/>
    <img src="src/public/images/hero/hero_leo.png" alt="Leo passenger" class="hero__character hero__character--leo floating-fast"/>
    <img src="src/public/images/hero/hero_kate.png" alt="Kate passenger" class="hero__character hero__character--kate floating-fast"/>
    <div class="hero__snow-layer" id="snow-layer"></div>
  </div>

  <div class="hero__content">
    <h1 class="hero__title">
      Would <span class="hero__title-highlight">YOU</span> Survive the Titanic?
    </h1>
    <button class="hero__cta" id="hero-cta">
      CHECK MY SURVIVAL CHANCES
    </button>
  </div>

  <audio id="hero-audio" src="src/public/audio/hero_soundtrack.mp3"></audio>
</section>

<section class="search" id="search">
  <div class="search__column search__column--form">
    <h2 class="search__title">Choose your passenger profile</h2>
    <form class="search__form" id="search-form">
      <div class="search__field">
        <label class="search__label">Port of departure</label>
        <div class="search__button-group search__button-group--ports">
          <button
                  type="button"
                  class="search__option-button"
                  data-field="port"
                  data-value="southampton"
          >
            Southampton
          </button>
          <button
                  type="button"
                  class="search__option-button"
                  data-field="port"
                  data-value="cherbourg"
          >
            Cherbourg
          </button>
          <button
                  type="button"
                  class="search__option-button"
                  data-field="port"
                  data-value="queenstown"
          >
            Queenstown
          </button>
        </div>
      </div>

      <div class="search__field">
        <label class="search__label">Gender</label>
        <div class="search__button-group search__button-group--gender">
          <button
                  type="button"
                  class="search__icon-button"
                  data-field="gender"
                  data-value="male"
                  aria-label="Male"
          >
            <img src="src/public/images/search/icons/icon_gender_man.png" alt="Male" class="search__icon-image" />
          </button>
          <button
                  type="button"
                  class="search__icon-button"
                  data-field="gender"
                  data-value="female"
                  aria-label="Female"
          >
            <img src="src/public/images/search/icons/icon_gender_woman.png" alt="Female" class="search__icon-image" />
          </button>
        </div>
      </div>

      <!-- Age Slider -->
      <div class="search__field">
        <label class="search__label">
          Age
          <span class="search__age-value" id="age-value">30</span>
        </label>
        <div class="search__slider-container">
          <input
                  type="range"
                  id="age"
                  name="age"
                  min="0"
                  max="80"
                  value="30"
                  class="search__slider"
          />
          <div class="search__slider-track"></div>
        </div>
      </div>

      <div class="search__field">
        <label class="search__label">Class</label>
        <div class="search__button-group search__button-group--class">
          <button
                  type="button"
                  class="search__option-button"
                  data-field="ticketClass"
                  data-value="1"
          >
            1st
          </button>
          <button
                  type="button"
                  class="search__option-button"
                  data-field="ticketClass"
                  data-value="2"
          >
            2nd
          </button>
          <button
                  type="button"
                  class="search__option-button"
                  data-field="ticketClass"
                  data-value="3"
          >
            3rd
          </button>
        </div>
      </div>

      <div class="search__field">
        <label class="search__checkbox-label">
          <input
                  type="checkbox"
                  id="travelWithFamily"
                  name="travelWithFamily"
                  class="search__checkbox"
          />
          <span class="search__checkbox-text">I travel with family</span>
        </label>
      </div>

      <div class="search__field search__field--family-size" id="family-size-field" style="display: none;">
        <label class="search__label">Family size</label>
        <div class="search__button-group search__button-group--family">
          <button
                  type="button"
                  class="search__option-button search__option-button--small"
                  data-field="familySize"
                  data-value="2"
          >
            2
          </button>
          <button
                  type="button"
                  class="search__option-button search__option-button--small"
                  data-field="familySize"
                  data-value="3"
          >
            3
          </button>
          <button
                  type="button"
                  class="search__option-button search__option-button--small"
                  data-field="familySize"
                  data-value="4"
          >
            4
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
              type="button"
              id="calculate-button"
              class="search__cta"
              disabled
      >
        Calculate my chances
      </button>

    </form>
  </div>

  <div class="search__column search__column--preview">
    <div class="search__preview" id="search-preview">
      <div class="search__preview-background" id="preview-background"></div>
      <div class="search__preview-effects" id="preview-effects"></div>
      <div class="search__preview-character-layer" id="preview-character-layer"></div>
      <div class="search__preview-seagulls" id="preview-seagulls"></div>
      <div class="search__preview-snow" id="preview-snow"></div>
    </div>
  </div>

  <audio id="harbor-audio" src="src/public/audio/search-sound.mp3" loop></audio>
</section>

<section id="results" class="results" style="display: none;">
  <!-- Sky layer (top half) -->
  <div class="results__background-sky"></div>

  <!-- Sea layer (bottom half) -->
  <div class="results__background-sea"></div>

  <!-- Titanic overlay (near horizon, hidden on mobile) -->
  <img
          src="src/public/images/results/results_titanic_sink.png"
          class="results__titanic"
          alt="Titanic sinking"
  >

  <!-- Content (left side, 50% width) -->
  <div class="results__content">
    <h1 class="results__title">You would probably</h1>
    <h2 class="results__emphasis"></h2>

    <!-- Details grouped together -->
    <div class="results__details">
      <p class="results__percentage"></p>
      <p class="results__subtitle"></p>
    </div>

    <button class="results__cta" id="try-again-btn">Try different parameters</button>
  </div>

  <!-- Passenger character (bottom right) -->
  <img
          src=""
          class="results__character"
          alt="Passenger"
  >
</section>

<script src="script.js"></script>
</body>

</html>
